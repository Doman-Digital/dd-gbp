name: CI

# Runs on every push to main and every pull request. This is the gate that was
# missing: before it, tests only ran when someone remembered to run them
# locally, and `release.yml` only fires on a tag -- long after a bad commit has
# already been merged.
#
# Runs on a single Node version (22.x, the middle of the >=20 <26 engines
# range) rather than a full matrix -- CI cost was the priority, and one
# version catches the vast majority of real breakage.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
